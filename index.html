<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行銷2_KOL成效資料庫</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background-color: #f8fafc; }
        .modal-bg { background-color: rgba(15, 23, 42, 0.9); backdrop-filter: blur(5px); }
        .text-kpi { font-size: 2rem; font-weight: 900; line-height: 1.2; }
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%;
            width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="app">
    <nav class="bg-slate-900 text-white p-5 shadow-xl sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-black tracking-wider flex items-center">
                <i class="fas fa-chart-line text-blue-400 mr-3"></i>行銷2_KOL成效資料庫
            </h1>
            <div class="flex items-center gap-3">
                <button v-if="savedId" @click="resetSettings" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded transition border border-slate-600">設定</button>
                <button v-if="savedId" @click="fetchData" class="bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded text-sm font-bold shadow-lg flex items-center transition active:scale-95" :disabled="loading">
                    <i :class="loading ? 'fas fa-spinner fa-spin' : 'fas fa-sync-alt'" class="mr-2"></i>
                    {{ loading ? '更新中' : '同步資料' }}
                </button>
            </div>
        </div>
    </nav>

    <div v-if="errorMsg" class="container mx-auto mt-6 p-6 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-xl shadow-lg">
        <h3 class="font-bold text-lg"><i class="fas fa-exclamation-triangle mr-2"></i>資料讀取異常</h3>
        <p class="mt-2 text-sm">{{ errorMsg }}</p>
        <div class="mt-4 flex gap-4">
            <button @click="resetSettings" class="bg-red-600 text-white px-4 py-2 rounded-lg font-bold text-sm">重新輸入 ID</button>
            <button @click="fetchData" class="bg-white border border-red-200 px-4 py-2 rounded-lg font-bold text-sm hover:bg-red-100">再試一次</button>
        </div>
    </div>

    <div v-if="!savedId" class="min-h-[80vh] flex items-center justify-center p-6">
        <div class="bg-white rounded-[2rem] shadow-2xl p-10 max-w-xl w-full text-center border">
            <h2 class="text-3xl font-black text-slate-800 mb-2">連結資料庫</h2>
            <p class="text-slate-500 mb-8">請輸入您的 Google Sheet ID</p>
            <input v-model="inputSheetId" type="text" placeholder="例如: 1A2B3C..." class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-blue-500 outline-none text-lg transition shadow-sm mb-4">
            <button @click="saveIdAndLoad" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black hover:bg-blue-700 shadow-xl text-xl transition">啟動分析</button>
        </div>
    </div>

    <div class="container mx-auto p-4 md:p-8" v-if="savedId && !errorMsg">
        <div class="bg-white p-6 rounded-3xl shadow-sm mb-8 border border-slate-100 flex flex-wrap gap-6 items-end">
            <div class="flex-1 min-w-[300px]">
                <label class="block text-xs font-black text-slate-400 mb-2 uppercase tracking-widest">快速搜尋網紅 / 專案 / 平台</label>
                <input v-model="searchQuery" type="text" placeholder="輸入關鍵字..." class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-lg outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
            <div class="w-full md:w-auto flex gap-8 px-4">
                <div class="text-center">
                    <div class="text-xs text-slate-400 font-bold uppercase mb-1">網紅總數</div>
                    <div class="text-2xl font-black text-slate-800">{{ filteredList.length }}</div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden min-h-[400px]">
            <div v-if="loading" class="flex flex-col items-center justify-center py-40 text-slate-400">
                <div class="loader"></div>
                <p class="text-xl font-bold mt-4">正在同步最新資料...</p>
            </div>

            <div v-else class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 text-slate-500 uppercase text-xs font-black border-b border-slate-200">
                        <tr>
                            <th class="px-10 py-5">網紅名稱</th>
                            <th class="px-10 py-5">最後平台 / 日期</th>
                            <th class="px-10 py-5 text-right">總營收</th>
                            <th class="px-10 py-5 text-center">成效詳情</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-base">
                        <tr v-for="kol in filteredList" :key="kol.name" class="hover:bg-blue-50/40 transition">
                            <td class="px-10 py-6">
                                <div class="font-bold text-slate-800 text-xl">{{ kol.name }}</div>
                                <span class="text-xs bg-slate-100 px-2 py-1 rounded inline-block mt-1 text-slate-500 font-bold uppercase">{{ kol.category }}</span>
                            </td>
                            <td class="px-10 py-6">
                                <div class="font-bold text-slate-700">{{ kol.platform }}</div>
                                <div class="text-xs text-slate-400 mt-1">最近更新: {{ kol.projects[0].date }}</div>
                            </td>
                            <td class="px-10 py-6 text-right font-black text-orange-600 text-xl">
                                ${{ formatNumber(calculateTotal(kol.projects, 'revenue')) }}
                            </td>
                            <td class="px-10 py-6 text-center">
