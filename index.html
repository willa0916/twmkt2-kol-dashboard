<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行銷2_KOL成效資料庫</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background-color: #f8fafc; }
        .modal-bg { background-color: rgba(15, 23, 42, 0.9); backdrop-filter: blur(5px); }
        .text-kpi { font-size: 2rem; font-weight: 900; line-height: 1.2; }
        [v-cloak] { display: none !important; }
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%;
            width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="app" v-cloak>
    <nav class="bg-slate-900 text-white p-5 shadow-xl sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-black tracking-wider flex items-center">
                <i class="fas fa-chart-line text-blue-400 mr-3"></i>行銷2_KOL成效資料庫
            </h1>
            <div class="flex items-center gap-3">
                <button v-if="savedId" @click="resetSettings" class="text-xs bg-slate-800 px-3 py-2 rounded border border-slate-600">設定</button>
                <button v-if="savedId" @click="fetchData" class="bg-blue-600 px-5 py-2 rounded text-sm font-bold shadow-lg">同步資料</button>
            </div>
        </div>
    </nav>

    <div v-if="!savedId" class="min-h-[80vh] flex items-center justify-center p-6">
        <div class="bg-white rounded-[2rem] shadow-2xl p-10 max-w-xl w-full text-center">
            <h2 class="text-3xl font-black text-slate-800 mb-8">連結資料庫</h2>
            <input v-model="inputSheetId" type="text" placeholder="輸入 Google Sheet ID" class="w-full p-4 bg-slate-50 border-2 rounded-xl mb-4">
            <button @click="saveIdAndLoad" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black">確認並啟動</button>
        </div>
    </div>

    <div class="container mx-auto p-4 md:p-8" v-if="savedId">
        <div class="bg-white p-6 rounded-3xl shadow-sm mb-8 flex gap-6 items-end border">
            <div class="flex-1">
                <label class="block text-xs font-black text-slate-400 mb-2 uppercase">快速搜尋</label>
                <input v-model="searchQuery" type="text" placeholder="搜尋網紅/專案..." class="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <div class="bg-white rounded-[2rem] shadow-xl overflow-hidden border">
            <div v-if="loading" class="py-40 text-center"><div class="loader"></div></div>
            <table v-else class="w-full text-left">
                <thead class="bg-slate-50 text-slate-500 text-xs font-black border-b">
                    <tr>
                        <th class="px-10 py-5">網紅 / 分類</th>
                        <th class="px-10 py-5">最新狀態</th>
                        <th class="px-10 py-5 text-right">總安裝</th>
                        <th class="px-10 py-5 text-right">總營收</th>
                        <th class="px-10 py-5 text-center">分析</th>
                    </tr>
                </thead>
                <tbody class="divide-y text-base">
                    <tr v-for="kol in filteredList" :key="kol.name" class="hover:bg
